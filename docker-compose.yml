services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:5173
      # INGEST_TOKEN: change-me   # uncomment to require X-Ingest-Token on ingest
    volumes:
      - model-data:/data

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]

volumes:
  model-data:
